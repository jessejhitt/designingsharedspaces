<body data-page="map.html">

<main class="page">
  <section class="page-head">
    <div class="wrap">
      <h1 class="h-page" id="map-title">Case Studies</h1>
      <div class="utility-row">
        <span class="note" id="map-count"></span>
        <a class="rule-link" id="back-link" href="case-studies.html">Filter through list</a>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="map-shell">
      <div id="map"></div>
      <div class="map-legend">
        <b>Status</b>
        <div><i style="background:#0093A5"></i>
          <label><input type="checkbox" id="toggle-established" checked style="margin-right:6px">Established</label></div>
        <div><i style="background:#EE9A63"></i>
          <label><input type="checkbox" id="toggle-emerging" checked style="margin-right:6px">Emerging</label></div>
        <div><i style="background:#D96629"></i>
          <label><input type="checkbox" id="toggle-opportunity" checked style="margin-right:6px">Opportunity</label></div>
      </div>
    </div>

    <div class="trio" style="margin-top:40px" id="map-list-wrap">
      <div style="grid-column:1/-1; border-top-color:var(--ink)">
        <h3>Every site in view</h3>
        <div id="map-list" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:2px; margin-top:14px"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
